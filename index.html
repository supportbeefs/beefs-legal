<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beefs - Legal</title>
    <meta name="description" content="Legal documents for the Beefs app." />
    <style>
      :root {
        --brand: #f5361f;
        --bg: #ffffff;
        --surface: #f6f6f7;
        --border: #e3e4e8;
        --text: #16181c;
        --text-secondary: #4a4e57;
        --text-muted: #767b85;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1114;
          --surface: #171a1f;
          --border: #272b32;
          --text: #f2f3f5;
          --text-secondary: #b9bec7;
          --text-muted: #868c96;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
          sans-serif;
        font-size: 17px;
        line-height: 1.6;
        padding: 1.5rem;
      }

      main {
        width: 100%;
        max-width: 28rem;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        font-size: 1.6rem;
      }

      .dot {
        width: 1rem;
        height: 1rem;
        border-radius: 999px;
        background: var(--brand);
      }

      p {
        color: var(--text-secondary);
      }

      ul {
        list-style: none;
        margin: 1.5rem 0 0;
        padding: 0;
      }

      li + li {
        margin-top: 0.75rem;
      }

      a.card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0.9rem;
        padding: 1rem 1.25rem;
        color: var(--text);
        font-weight: 600;
        text-decoration: none;
      }

      a.card span.arrow {
        color: var(--brand);
      }

      footer {
        margin-top: 2rem;
        color: var(--text-muted);
        font-size: 0.9rem;
      }

      footer a {
        color: var(--brand);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><span class="dot"></span>Beefs</div>
      <p>Challenge anyone. Set the terms. Settle the score.</p>
      <ul>
        <li>
          <a class="card" href="./privacy.html">Privacy Policy <span class="arrow">&rarr;</span></a>
        </li>
      </ul>
      <footer>
        Support: <a href="mailto:supportbeefs@gmail.com">supportbeefs@gmail.com</a>
      </footer>
    </main>
  </body>
</html>
